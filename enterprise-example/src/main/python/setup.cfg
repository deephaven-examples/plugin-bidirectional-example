[metadata]
name = deephaven-ent-plugin
description = Deephaven Core+ Bidirectional Plugin Example
long_description = file: README.md
long_description_content_type = text/markdown
version = 0.0.1
url = https://github.com/deephaven-examples/plugin-bidirectional-example
project_urls =
    Source Code = https://github.com/deephaven-examples/plugin-bidirectional-example
    Bug Tracker = https://github.com/deephaven-examples/plugin-bidirectional-example/issues
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    Environment :: Plugins
    Development Status :: 3 - Alpha
keywords = deephaven, plugin, example
author='Deephaven Data Labs',
author_email='python@deephaven.io',
platforms = any

[options]
packages=find_namespace:
install_requires =
    deephaven-core>=0.37.6
    deephaven-plugin>=0.6.0
    deephaven-plugin-utilities>=0.0.2;python_version<'3.11'
include_package_data = True

[options.packages.find]
where = .
exclude = client

[options.entry_points]
deephaven.plugin =
    registration_cls = deephaven.ent.plugin._register:IncrementPluginRegistration